<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoaib AI Assistant</title>
  <style>
    /* Basic reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Arial', sans-serif;
    }

    body {
      background-color: #1e1e1e;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 500px;
      background-color: #2c2c2c;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .chat {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
    }

    .chat.user .message {
      align-self: flex-end;
      background-color: #4a90e2;
      color: white;
    }

    .chat.ai .message {
      align-self: flex-start;
      background-color: #3a3a3a;
      color: #e0e0e0;
    }

    .message {
      padding: 10px 15px;
      border-radius: 20px;
      max-width: 80%;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #444;
    }

    .input-area input {
      flex: 1;
      padding: 15px;
      border: none;
      outline: none;
      background-color: #2c2c2c;
      color: #e0e0e0;
      font-size: 16px;
    }

    .input-area button {
      padding: 0 20px;
      background-color: #4a90e2;
      border: none;
      cursor: pointer;
      color: white;
      font-weight: bold;
      transition: 0.3s;
    }

    .input-area button:hover {
      background-color: #357abd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="chat-box" id="chat-box">
      <div class="chat ai">
        <div class="message">Hi! I'm Shoaib AI. Ask me anything.</div>
      </div>
    </div>
    <div class="input-area">
      <input type="text" id="user-input" placeholder="Type your question here...">
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function sendMessage() {
      const question = userInput.value.trim();
      if (!question) return;

      // Show user message
      const userMessage = document.createElement('div');
      userMessage.classList.add('chat', 'user');
      userMessage.innerHTML = `<div class="message">${question}</div>`;
      chatBox.appendChild(userMessage);
      chatBox.scrollTop = chatBox.scrollHeight;
      userInput.value = '';

      // Generate AI response
      setTimeout(() => {
        const aiMessage = document.createElement('div');
        aiMessage.classList.add('chat', 'ai');

        let answer = generateAnswer(question);
        aiMessage.innerHTML = `<div class="message">${answer}</div>`;
        chatBox.appendChild(aiMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
      }, 500);
    }

    function generateAnswer(question) {
      question = question.toLowerCase();

      // Special answer for "Who made you?" or similar
      if (question.includes('kisne') && question.includes('banaya')) {
        return "Shoaib Akhtar Khan";
      }

      // Some example default answers
      if (question.includes('hello') || question.includes('hi')) {
        return "Hello! How can I help you today?";
      }

      if (question.includes('your name')) {
        return "I am Shoaib AI Assistant.";
      }

      if (question.includes('time')) {
        return `Current time is ${new Date().toLocaleTimeString()}`;
      }

      if (question.includes('date')) {
        return `Today's date is ${new Date().toLocaleDateString()}`;
      }

      return "Sorry, I don't have an answer for that yet, but I'm learning!";
    }

    // Allow pressing Enter to send message
    userInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') sendMessage();
    });
  </script>
</body>
</html>
